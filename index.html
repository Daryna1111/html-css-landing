<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page - Funtechs</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="logo">@Funtechs</div>
      <nav class="nav">
        <a href="#" class="nav-link">HOME</a>
        <a href="#" class="nav-link">CONTACT</a>
        <a href="#" class="nav-link">TEAM</a>
        <a href="#" class="btn btn-outline-nav">SIGN IN</a>
        <a href="#" class="btn btn-primary-nav">SIGN UP</a>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-left">
        <h1 class="hero-title">Design Confidentially.</h1>
        <p class="hero-text">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. 
          Tristique sapien praesent et vestibulum blandit faucibus. 
          Risus ut a, sodales magna sem velit quam.
        </p>
        <div class="hero-buttons">
          <button class="btn btn-primary">GETTING STARTED</button>
          <button class="btn btn-secondary">CALL US NOW</button>
        </div>
      </div>

      <div class="hero-right">
        <img src="https://illustrations.popsy.co/blue/work-from-home.svg" alt="Design Illustration" class="hero-img">
      </div>
    </main>

    <footer class="partners">
      <div class="partner-icon">G</div>
      <div class="partner-icon">f</div>
      <div class="partner-icon">yt</div>
      <div class="partner-icon">in</div>
      <div class="partner-icon">m</div>
      <span class="partner-brand brand-fiverr">fiverr.</span>
      <span class="partner-brand brand-netflix">NETFLIX</span>
    </footer>
  </div>

</body>
</html>
